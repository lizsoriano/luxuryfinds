<div class="overlay" id="sched-modal" style="display:none" onclick="closeModal('sched-modal',event)"><div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title" id="sched-modal-title">Reagendar entrega</div><div class="aviso-box" id="sched-aviso" style="display:none"></div>
  <div class="field"><label>Punto de entrega</label><div class="loc-cards">
    <div class="loc-card" id="loc-indeco" onclick="selectLoc('indeco')"><div class="loc-name">Indeco de 8</div><div class="loc-hours">8:30 am – 12:30 pm</div></div>
    <div class="loc-card" id="loc-villas" onclick="selectLoc('villas')"><div class="loc-name">Villas del Encanto</div><div class="loc-hours">4:00 pm – 8:00 pm</div></div>
  </div></div>
  <div class="field"><label>Fecha</label><input type="date" id="sched-date" onchange="updateSlots()"></div>
  <div class="field" id="slots-wrap" style="display:none"><label>Horario</label><div class="slots" id="time-slots"></div></div>
  <div class="field"><label>Notas</label><textarea id="sched-notes"></textarea></div>
  <div class="modal-actions"><button class="btn-cancel-m" onclick="closeModal('sched-modal')">Cancelar</button><button class="btn-primary" onclick="saveSchedule()">Confirmar</button></div>
</div></div>
<div class="overlay" id="cancel-entrega-modal" style="display:none" onclick="closeModal('cancel-entrega-modal',event)"><div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title">Cancelar entrega</div><div class="field"><label>Motivo</label><textarea id="cancel-reason"></textarea></div>
  <div class="modal-actions"><button class="btn-cancel-m" onclick="closeModal('cancel-entrega-modal')">Cerrar</button><button class="btn-primary" onclick="confirmCancelEntrega()">Cancelar entrega y avisar</button></div>
</div></div>
