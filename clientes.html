<!DOCTYPE html><script>location.replace('admin/clientes.html')</script>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - glamstudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">glam<span>studio</span></div>
    <div class="nav">
      <a href="pedidos.html">Pedidos</a><a href="catalogo.html">Catálogo</a>
      <a href="por-ordenar.html">Por ordenar</a><a href="en-camino.html">En camino</a><a href="disponibles.html">Disponibles</a><a href="clientes.html" class="active">Clientes</a>
      <a href="agenda.html">Mi agenda</a>
    </div>
  </div>
  <div class="page active">
    <div class="page-header"><div><h1 class="page-title">Clientes</h1><p class="page-subtitle">Directorio e historial de pedidos</p></div>
      <button class="btn-primary" onclick="openClientModal()">+ Nueva clienta</button></div>
    <input id="clients-search" class="search-box clients-search" type="search" placeholder="Buscar por nombre, celular o Instagram" oninput="renderClients(this.value)">
    <div id="clients-list" class="clients-list"></div>
  </div>
</div>

<div class="overlay" id="client-modal" style="display:none" onclick="closeModal('client-modal',event)"><div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title" id="client-modal-title">Nueva clienta</div>
  <div class="field"><label>Nombre</label><input id="c-name"></div>
  <div class="field"><label>Celular</label><input id="c-phone"></div>
  <div class="field"><label>WhatsApp</label><input id="c-whatsapp"></div>
  <div class="field"><label>Instagram</label><input id="c-instagram" placeholder="@usuario"></div>
  <div class="field"><label>Email</label><input id="c-email" type="email"></div>
  <div class="field"><label>Notas</label><textarea id="c-notes"></textarea></div>
  <div class="modal-actions"><button class="btn-cancel-m" onclick="closeModal('client-modal')">Cancelar</button><button class="btn-primary" onclick="saveClient()">Guardar</button></div>
</div></div>
<div class="overlay" id="client-detail-modal" style="display:none" onclick="closeModal('client-detail-modal',event)"><div class="modal client-detail-modal" onclick="event.stopPropagation()">
  <div id="client-detail-content"></div><div class="modal-actions"><button class="btn-cancel-m" onclick="closeModal('client-detail-modal')">Cerrar</button></div>
</div></div>
<div class="toast" id="toast"></div><script src="js/shared/data.js"></script><script src="app.js"></script>
</body></html>
