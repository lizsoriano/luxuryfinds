d"><label>Fecha</label><input type="date" id="payment-date"></div><div class="field"><label>Método</label><select id="payment-method"><option>Transferencia</option><option>Efectivo</option><option>Depósito</option><option>Tarjeta</option><option>Otro</option></select></div><div class="field"><label>Referencia</label><input id="payment-reference"></div><div class="field"><label>Comprobante</label><input type="file" id="payment-proof" accept="image/jpeg,image/png,application/pdf"></div><div class="field"><label>Notas</label><textarea id="payment-notes"></textarea></div><div class="modal-actions"><button class="btn-cancel-m" onclick="closeFinanceModal('payment-modal')">Cancelar</button><button class="btn-primary" onclick="saveAdminPayment()">Guardar</button></div></div></div><div id="ticket-detail-modal" style="display:none"></div>`)</script><script src="../js/shared/data.js"></script><script src="../js/admin/finance-admin.js"></script></body></html>
