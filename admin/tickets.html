<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets — Admin</title><link rel="stylesheet" href="../styles.css"></head><body><script src="admin-shell.js"></script><script>AdminShell.mount('tickets',`<main class="page active"><div class="page-header"><div><h1 class="page-title">Tickets y ventas</h1><p class="page-subtitle">Historial financiero congelado por venta</p></div></div><input class="search-box clients-search" placeholder="Buscar clienta o folio" oninput="renderTicketsAdmin(this.value)"><div id="tickets-grid" class="finance-grid"></div></main><div class="overlay" id="ticket-detail-modal" style="display:none"><div class="modal finance-detail"><div id="ticket-detail-content"></div><div class="modal-actions"><button class="btn-cancel-m" onclick="closeFinanceModal('ticket-detail-modal')">Cerrar</button></div></div></div><div class="overlay" id="plan-modal" style="display:none"><div class="modal"><div class="modal-title">Configurar plan de pagos</div><div id="plan-ticket-label" class="aviso-box"></div><div class="field"><label>Plantilla</label><select onchange="applyPlanTemplate(this.value)"><option value="">Seleccionar</option><option value="1">Semanal — Viernes</option><option value="2">Quincenal</option><option value="3">50% + semanal</option><option value="4">3 pagos</option></select></div><div class="field"><label>Frecuencia</label><select id="plan-frequency"><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="custom">Personalizada</option></select></div><div class="field"><label>Día de pago</label><select id="plan-day"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div><div class="field"><label>Primer vencimiento</label><input type="date" id="plan-first-date"></div><div class="field"><label>Número de pagos</label><input type="number" id="plan-count" value="4" min="1"></div><div class="field"><label>Monto sugerido</label><input type="number" id="plan-suggested" value="0" step="0.01"></div><div class="field"><label>Anticipo pagado</label><input type="number" id="plan-down" value="0" step="0.01"></div><div class="field"><label>Tipo de recargo</label><select id="plan-surcharge-type"><option value="none">Sin recargo</option><option value="percent">Porcentaje</option><option value="fixed">Cantidad fija</option></select></div><div class="field"><label>Valor del recargo</label><input type="number" id="plan-surcharge" value="0" step="0.01"></div><div class="modal-actions"><button class="btn-cancel-m" onclick="closeFinanceModal('plan-modal')">Cancelar</button><button class="btn-primary" onclick="savePaymentPlan()">Crear plan</button></div></div></div><div class="overlay" id="payment-modal" style="display:none"><div class="modal"><div class="modal-title">Registrar abono</div><div class="field"><label>Cantidad</label><input type="number" id="payment-amount" step="0.01"></div><div class="field"><label>Fecha</label><input type="date" id="payment-date"></div><div class="field"><label>Método</label><select id="payment-method"><option>Transferencia</option><option>Efectivo</option><option>Depósito</option><option>Tarjeta</option><option>Otro</option></select></div><div class="field"><label>Referencia</label><input id="payment-reference"></div><div class="field"><label>Comprobante (máx. 750 KB)</label><input type="file" id="payment-proof" accept="image/jpeg,image/png,application/pdf"></div><div class="field"><label>Notas</label><textarea id="payment-notes"></textarea></div><div class="modal-actions"><button class="btn-cancel-m" onclick="closeFinanceModal('payment-modal')">Cancelar</button><button class="btn-primary" onclick="saveAdminPayment()">Guardar abono</button></div></div></div>`)</script><script src="../js/shared/data.js"></script><script src="../js/admin/finance-admin.js"></script></body></html>
